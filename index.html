<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Учеба | Практикум</title>
  <script src="scripts/main.js" defer></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #121214;
      color: #e1e1e6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #202024;
      border: 1px solid #323238;
      border-radius: 12px;
      padding: 32px 40px;
      max-width: 500px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      color: #f7df1e;
      margin-top: 0;
      font-size: 2rem;
    }
    p {
      color: #a8a8b3;
      line-height: 1.6;
    }
    .hint {
      background: #121214;
      border-left: 4px solid #f7df1e;
      padding: 12px 16px;
      margin-top: 20px;
      text-align: left;
      font-size: 0.9rem;
      border-radius: 0 8px 8px 0;
    }
    kbd {
      background: #323238;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>JavaScript Практикум</h1>
    <p>Рабочая среда для прохождения уроков Александра Ламкова и решения задач с ментором.</p>
    <div class="hint">

    </div>
  </div>
</body>
</html>
