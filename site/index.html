<!DOCTYPE html>
<html lang="ru" data-theme="paper">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Notes — База конспектов</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <link
    id="hljs-light"
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css"
  >
  <link
    id="hljs-dark"
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css"
    disabled
  >
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button
        id="sidebar-toggle"
        class="icon-btn mobile-only"
        type="button"
        aria-label="Открыть оглавление"
        aria-expanded="false"
      >
        ☰
      </button>

      <div class="appearance-wrap">
        <button
          id="appearance-btn"
          class="icon-btn"
          type="button"
          aria-label="Настройки темы и шрифта"
          aria-haspopup="true"
          aria-expanded="false"
          title="Настройки темы и шрифта"
        >
          🎨
        </button>

        <div id="appearance-menu" class="appearance-menu" hidden>
          <div class="appearance-section">
            <span class="appearance-title">Тема</span>
            <div id="theme-options" class="appearance-grid"></div>
          </div>
          <div class="appearance-section">
            <span class="appearance-title">Шрифт</span>
            <div id="font-options" class="appearance-grid"></div>
          </div>
        </div>
      </div>

      <div class="subject-wrap">
        <button
          id="subject-btn"
          class="pill-btn subject-btn"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          title="Выбрать раздел конспектов"
        >
          <span id="subject-label">JS Конспекты</span>
          <span class="subject-caret" aria-hidden="true">▾</span>
        </button>

        <div id="subject-menu" class="subject-menu" hidden>
          <span class="appearance-title">Раздел конспектов</span>
          <div id="subject-options" class="subject-list"></div>
        </div>
      </div>
    </div>

    <div class="topbar-right">
      <div class="search-wrap">
        <label class="search-box" aria-label="Поиск по конспектам">
          <input
            id="search-input"
            type="search"
            placeholder="Поиск урока, метода или кода (Ctrl+K)..."
            autocomplete="off"
          >
        </label>
        <div id="search-results" class="search-results" role="listbox" hidden></div>
      </div>

      <button
        id="cheat-btn"
        class="icon-btn"
        type="button"
        aria-label="Режим шпаргалки"
        aria-pressed="false"
        title="Режим шпаргалки: только суть, заметки и 3 ловушки"
      >
        ⚡
      </button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Оглавление уроков">
      <div class="sidebar-header">
        <span class="sidebar-title">Оглавление курса</span>
        <span id="progress-badge" class="progress-badge">0 / 0</span>
      </div>
      <nav id="lesson-nav" class="lesson-nav"></nav>
      <div class="sidebar-footer">
        <a id="bundle-link" class="bundle-link" href="#" download hidden>
          📥 Весь курс для ИИ (.md)
        </a>
      </div>
    </aside>

    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <main id="main-content" class="main-content">
      <div class="article-toolbar">
        <span id="lesson-module" class="lesson-module"></span>

        <div class="toolbar-actions">
          <button id="status-done-btn" class="status-btn" type="button" data-status="done">
            ✓ Изучено
          </button>
          <button id="status-review-btn" class="status-btn" type="button" data-status="review">
            ↻ Повторить
          </button>
          <button id="copy-ai-btn" class="status-btn" type="button" title="Скопировать урок с промптом для ИИ">
            🤖 Для ИИ
          </button>
          <a id="docx-link" class="docx-link" href="#" download hidden>
            .docx
          </a>
        </div>
      </div>

      <article id="lesson-article" class="lesson-article">
        <p class="loading-text">Загружаем конспект...</p>
      </article>
    </main>
  </div>
</body>
</html>
